! Cisco IOS clean fixture — passes all Phase 1 checks
! Generated for PRAMANA test suite. Not a real device config.
!
version 15.2
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname ROUTER-CLEAN-01
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! SNMP with non-default community — CHK-002 PASS
snmp-server community Xk9mP2qLrT7vN4wZ RO
snmp-server location "Server Room A"
!
! Logging configured — CHK-005 PASS
logging host 10.0.0.100
logging trap notifications
!
ip ssh version 2
!
! HTTP disabled — CHK-006 PASS
no ip http server
no ip http secure-server
!
! Access-list for VTY
