## Last changed: 2026-01-01 00:00:00 UTC;
version 12.1R3.5;

system {
    host-name rtr-clean-01;
    domain-name lab.example.com;
    time-zone America/New_York;
    services {
        ssh {
            root-login deny;
            protocol-version v2;
        }
        /* telnet not configured — compliant */
        /* web-management http not configured — compliant */
    }
    syslog {
        host 10.0.100.5 {
            any any;
            port 514;
        }
        file messages {
            any any;
        }
    }
    ntp {
        server 10.0.100.10;
        server 10.0.100.11;
    }
    login {
        class MGMT-READ-ONLY {
            permissions view;
        }
    }
}

snmp {
    community NTRO-SNMP-RO {
        authorization read-only;
        clients {
            10.0.100.0/24;
        }
    }
    /* No public/private communities — compliant */
}

firewall {
    filter MGMT-ACCESS {
        term permit-mgmt {
            from {
                source-address {
                    10.0.100.0/24;
                }
            }
            then accept;
        }
        term deny-all {
            then {
                discard;
            }
        }
    }
}

interfaces {
    fxp0 {
        unit 0 {
            family inet {
                filter {
                    input MGMT-ACCESS;
                }
                address 10.0.0.1/24;
            }
        }
    }
}
