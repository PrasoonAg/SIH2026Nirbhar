[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirbhar"
version = "0.1.0"
description = "NIRBHAR — India-owned certified hybrid CPU-GPU optimization solver core (SIH 2026, PS SIH26119, Team Vernils)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — SIH 2026 / Team Vernils / MRPL" }
authors = [{ name = "Team Vernils", email = "nirbhar@sih2026.in" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
jax = ["jax[cpu]>=0.4.30"]
numba = ["numba>=0.60"]
all = ["nirbhar[jax,numba]"]

[project.scripts]
nirbhar = "nirbhar.cli:main"
nirbhar-verify = "nirbhar_verify.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nirbhar*", "nirbhar_verify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running benchmarks (deselect with '-m not slow')",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
