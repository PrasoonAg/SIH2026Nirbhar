<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Precision Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B"/>
      <stop offset="60%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>

    <!-- Subtle Iso-contour / Objective level curve gradient -->
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Subtle Cutting Plane line gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container with subtle inner border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#1E3A5F" stroke-width="1.2" fill="none"/>

  <!-- Mathematical Coordinate & Simplex Facet Lattice (Subtle) -->
  <!-- Faint isometric / grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.18"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.18"/>

  <!-- Convex Objective Level Sets / Contours: f(x) = c -->
  <ellipse cx="49" cy="11" rx="18" ry="12" stroke="url(#contourGrad)" stroke-width="1" stroke-dasharray="3 2" transform="rotate(-25 49 11)"/>
  <ellipse cx="49" cy="11" rx="30" ry="20" stroke="url(#contourGrad)" stroke-width="0.75" stroke-dasharray="4 3" transform="rotate(-25 49 11)"/>
  <ellipse cx="49" cy="11" rx="44" ry="30" stroke="url(#contourGrad)" stroke-width="0.5" opacity="0.6" transform="rotate(-25 49 11)"/>

  <!-- Supporting Hyperplane / Cutting Plane tangent to optimal vertex -->
  <line x1="16" y1="2" x2="62" y2="24" stroke="url(#planeGrad)" stroke-width="1"/>

  <!-- Authentic Minimal Devanagari 'न' Glyph (White for maximum crisp legibility) -->
  <path d="M 48.74 16.74 L 43.39 16.74 L 43.39 51.00 L 39.19 51.00 L 39.19 31.35 L 27.26 31.35 Q 27.26 33.03 27.22 34.23 Q 27.18 35.43 27.00 36.20 Q 26.82 36.98 26.46 37.34 Q 26.11 37.70 25.47 37.70 Q 24.15 37.70 22.96 36.83 Q 21.78 35.96 20.87 34.74 Q 19.97 33.51 19.43 32.19 Q 18.90 30.86 18.90 29.95 Q 18.90 29.13 19.25 28.68 Q 19.61 28.21 20.20 27.98 Q 20.79 27.75 21.54 27.71 Q 22.29 27.65 23.05 27.65 L 39.19 27.65 L 39.19 16.74 L 15.26 16.74 L 15.26 13.00 L 48.74 13.00 L 48.74 16.74 Z" fill="#FFFFFF"/>

  <!-- Precision Optimal Vertex Pin (Saffron / Amber Atmanirbhar core at optimal solution) -->
  <circle cx="49.24" cy="10.50" r="2.8" fill="#D9730D" stroke="#FFFFFF" stroke-width="0.8"/>
</svg>