server {
    listen 80;
    server_name _;

    # Offline-safe CSP — no CDN, no external resources (INV-11)
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Health endpoint (used by Compose healthcheck)
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API reverse proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA — all non-API paths serve index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # PDF and report downloads (longer cache)
    location /reports/ {
        root /usr/share/nginx/html;
        expires 7d;
    }
}
