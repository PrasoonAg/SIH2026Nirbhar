[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pramana"
version = "0.1.0"
description = "Offline, self-teaching, multi-vendor network-configuration compliance auditor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "pygit2>=1.15.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-anyio>=0.0.0",
    "hypothesis>=6.100.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "import-linter>=2.1",
]

[project.scripts]
pramana = "pramana.bootstrap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pramana"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "inv(id): marks a test as enforcing a specific invariant (e.g. inv('INV-07'))",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.importlinter]
root_packages = ["pramana"]
include_external_packages = true
