config system global
    set hostname FW-CLEAN-01
    set admin-telnet disable
    set admin-sport 443
    set timezone US/Eastern
    set admintimeout 10
end

config system admin
    edit admin
        set password ENC AAAA1234BBBB
        set accprofile super_admin
        set trusted-hosts 10.0.100.0 255.255.255.0
    next
end

config system snmp sysinfo
    set status enable
end

config system snmp community
    edit 1
        set name NTRO-SNMPv2-RO
        set status enable
        set hosts
            edit 1
                set ip 10.0.100.0
                set source-ip 10.0.0.1
            next
        end
    next
end

config system interface
    edit mgmt
        set ip 10.0.0.1 255.255.255.0
        set allowaccess https ssh ping
        set type physical
    next
end

config system ntp
    set ntpsync enable
    set server-mode disable
    set syncinterval 60
    config ntpserver
        edit 1
            set server 10.0.100.10
            set ntpv3 disable
        next
        edit 2
            set server 10.0.100.11
        next
    end
end

config log syslogd setting
    set status enable
    set server 10.0.100.5
    set mode udp
    set port 514
    set facility local7
end
