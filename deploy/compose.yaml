services:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: pramana-backend:dev
    restart: unless-stopped
    environment:
      PRAMANA_DB_URL: "sqlite+aiosqlite:////data/pramana.db"
      PRAMANA_DATA_DIR: "/data"
      PRAMANA_MODELS_DIR: "/app/models"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - pramana_data:/data
      - ./models:/app/models:ro
    networks:
      - core
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # ── Database ─────────────────────────────────────────────────────────────────
  # Default: SQLite via a volume (no separate service needed).
  # For fleet mode: set PRAMANA_DB_URL to postgresql+asyncpg://... and
  # uncomment the postgres service below.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    profiles:
      - fleet          # only starts when --profile fleet is passed
    environment:
      POSTGRES_USER: pramana
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: pramana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramana"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (T2 — only in fleet/t2 profile) ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - t2
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - core           # internal only — no route out
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ── nginx (edge proxy) ───────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    image: pramana-frontend:dev
    restart: unless-stopped
    ports:
      - "${PRAMANA_BIND_ADDR:-127.0.0.1}:${PRAMANA_PORT:-8080}:80"
    networks:
      - core
      - edge           # nginx is the ONLY container on the edge network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  core:
    # internal: true — backend, DB and Ollama have NO route out (INV-11)
    driver: bridge
    internal: true

  edge:
    # nginx joins both core and edge; it is the ONLY container that publishes a port
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  pramana_data:
    driver: local
  postgres_data:
    driver: local
  ollama_data:
    driver: local

# ── Secrets ────────────────────────────────────────────────────────────────────
secrets:
  db_password:
    file: ./data/secrets/db_password.txt
