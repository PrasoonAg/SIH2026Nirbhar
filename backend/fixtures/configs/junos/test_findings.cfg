## Image-specific comments
version 12.1R3.5;

system {
    host-name rtr-findings-01;
    domain-name lab.example.com;
    time-zone America/New_York;
    /* Management plane */
    services {
        telnet;
        ssh {
            root-login deny;
        }
        web-management {
            http {
                interface fxp0.0;
            }
        }
    }
    syslog {
        /* No remote syslog configured */
        file messages {
            any any;
        }
    }
    /* No NTP configured */
}

snmp {
    community public {
        authorization read-only;
    }
    community private {
        authorization read-write;
    }
}

interfaces {
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.1/24;
            }
        }
    }
}

routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.0.0.254;
    }
}
