! Cisco IOS test fixture — contains deliberate findings for all 3 Phase 1 checks
! Generated for PRAMANA test suite. Not a real device config.
!
version 15.2
service timestamps log datetime msec
service timestamps debug datetime msec
no service password-encryption
!
hostname ROUTER-TEST-01
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! SNMP with default community — CHK-002 FAIL
snmp-server community public RO
snmp-server community private RW
snmp-server location "Server Room A"
snmp-server contact admin@example.com
!
! Logging — CHK-005 PASS (syslog configured)
logging host 10.0.0.100
logging trap notifications
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! HTTP server disabled — CHK-006 PASS
no ip http server
no ip http secure-server
!
interface GigabitEthernet0/0
 description WAN Interface
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Interface
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
! VTY lines — Telnet enabled (CHK-001 FAIL) AND no access-class (CHK-003 FAIL)
line vty 0 4
 exec-timeout 5 0
 login local
 transport input telnet ssh
!
line vty 5 15
 exec-timeout 5 0
 login local
 transport input telnet ssh
!
end
