config system global
    set hostname FW-FINDINGS-01
    set admin-telnet enable
    set admin-sport 443
    set timezone US/Eastern
    set admintimeout 480
end

config system admin
    edit admin
        set password ENC AAAA1234BBBB
        set accprofile super_admin
    next
end

config system snmp sysinfo
    set status enable
    set description "Lab Firewall"
end

config system snmp community
    edit 1
        set name public
        set status enable
        set hosts
            edit 1
                set ip 0.0.0.0
            next
        end
    next
    edit 2
        set name private
        set status enable
    next
end

config system interface
    edit mgmt
        set ip 10.0.0.1 255.255.255.0
        set allowaccess https ssh http ping telnet
        set type physical
    next
end

config log setting
    set resolve-ip disable
end
